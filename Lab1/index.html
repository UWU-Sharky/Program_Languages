<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>AI Chat</title></head>
<body>
<div id="chat" style="height:300px;overflow-y:scroll;border:1px solid #ccc;padding:10px;"></div>
<input id="msg" type="text" placeholder="Введите сообщение..." style="width:80%;" autofocus>
<button onclick="send()">Отправить</button>
<script>
    const ws = new WebSocket("ws://" + location.host + "/ws");
    const c = document.getElementById("chat"), m = document.getElementById("msg");
    ws.onmessage = e => c.innerHTML += "<div><b>AI:</b> " + e.data + "</div>";
    function send() {
        if(!m.value) return;
        c.innerHTML += "<div><b>Вы:</b> " + m.value + "</div>";
        ws.send(m.value);
        m.value = "";
    }
    m.onkeydown = e => { if(e.key === "Enter") send(); };
</script>
</body>
</html>
